<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#" aria-label="NoteAdda home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" />
          <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20M8 7h8M8 10h8" />
        </svg>
      </span>
      <span>Note<span class="brand-accent">Adda</span></span>
    </a>

    <label class="header-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" /><path d="m16 16 4.5 4.5" /></svg>
      <input [value]="searchQuery" (input)="onSearchInput($event)" placeholder="Search notes, subjects, or universities..." aria-label="Search study notes" />
      <span class="search-shortcut">⌘ K</span>
    </label>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#marketplace">Browse notes</a>
      <a href="#how-it-works">How it works</a>
    </nav>

    <div class="header-actions">
      <button class="button button-dark sell-button" (click)="sellClick.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5" /></svg>
        Sell notes
      </button>
      <div class="profile-wrap">
        <button class="profile-button" (click)="profileOpen = !profileOpen" [attr.aria-expanded]="profileOpen" aria-label="Open account menu">
          <span class="profile-avatar">SK</span>
          <span class="profile-chevron">⌄</span>
        </button>
        @if (profileOpen) {
          <div class="profile-menu">
            <strong>Sushan Karki</strong>
            <small>sushan&#64;noteadda.com</small>
            <a href="#marketplace">My library</a>
            <a href="#sell-cta">Seller studio</a>
          </div>
        }
      </div>
      <button class="mobile-toggle" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-label="Toggle navigation">
        {{ menuOpen ? '×' : '☰' }}
      </button>
    </div>
  </div>
  @if (menuOpen) {
    <div class="mobile-menu">
      <label class="mobile-search">
        <input [value]="searchQuery" (input)="onSearchInput($event)" placeholder="Search notes..." aria-label="Search study notes" />
      </label>
      <a href="#marketplace" (click)="menuOpen = false">Browse marketplace</a>
      <a href="#how-it-works" (click)="menuOpen = false">How it works</a>
      <button class="button button-dark" (click)="sellClick.emit(); menuOpen = false">Start selling notes</button>
    </div>
  }
</header>
