<section class="bg-gradient-to-b from-indigo-50/50 via-white to-slate-50 pb-6 pt-10 dark:from-indigo-950/30 dark:via-slate-900 dark:to-slate-950 sm:pb-8 sm:pt-12">
  <div class="mx-auto max-w-3xl px-4 text-center sm:px-6">
    <h1 class="mb-3 text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">
      Better notes. Easier exam prep.
    </h1>
    <p class="mx-auto mb-7 max-w-xl text-base text-slate-600 dark:text-slate-300">
      Find clear study notes, solved past papers, and semester guides shared by students across Nepal.
    </p>

    <div class="mx-auto flex max-w-2xl items-center gap-2 rounded-2xl border border-slate-200 bg-slate-50 p-1.5 shadow-xs focus-within:border-indigo-500 focus-within:bg-white dark:border-slate-700 dark:bg-slate-800 dark:focus-within:bg-slate-900" role="search">
      <svg class="ml-3 h-4 w-4 shrink-0 stroke-slate-400" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.8" />
        <path d="m16 16 4.5 4.5" />
      </svg>
      <input
        class="w-full border-0 bg-transparent px-2 py-2 text-sm text-slate-900 outline-none placeholder:text-slate-400 dark:text-slate-100"
        [value]="searchQuery"
        (input)="onSearchInput($event)"
        (keyup.enter)="browse.emit()"
        placeholder="Search subject, course, or university (e.g. DSA, TU, MBBS)..."
        aria-label="Search notes"
      />
      <button
        type="button"
        class="shrink-0 cursor-pointer rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700"
        (click)="browse.emit()"
      >
        Find notes
      </button>
    </div>
  </div>
</section>
