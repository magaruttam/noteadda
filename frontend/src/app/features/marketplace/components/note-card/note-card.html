<article class="book-card">
  <button
    type="button"
    class="book-stage"
    (click)="preview.emit(note)"
    [attr.aria-label]="'Preview ' + note.title"
  >
    @if (note.badge) {
      <span class="stage-badge">{{ note.badge }}</span>
    }
    @if (note.originalPrice && note.originalPrice > note.price) {
      <span class="discount-pill">
        Save {{ Math.round(((note.originalPrice - note.price) / note.originalPrice) * 100) }}%
      </span>
    }

    <div class="book-cover" [class]="'book-cover cover-' + note.color">
      <div class="book-spine" aria-hidden="true"></div>
      <div class="book-cover-inner">
        <span class="book-kicker">{{ note.course }}</span>
        <strong class="book-cover-title">{{ note.title }}</strong>
        <span class="book-cover-meta">{{ note.semester }} · {{ note.pages }}p</span>
      </div>
    </div>

    <span class="stage-hover">Quick preview</span>
  </button>

  <div class="book-info">
    <div class="book-uni">{{ note.university }}</div>
    <button type="button" class="book-title" (click)="preview.emit(note)">
      {{ note.title }}
    </button>

    <div class="book-author">By {{ note.seller }}</div>

    <div class="book-rating-row">
      <span class="rating">
        <span class="star" aria-hidden="true">★</span>
        <strong>{{ note.rating }}</strong>
        <span class="reviews">({{ note.reviews }})</span>
      </span>
      <span class="sold-count">{{ note.downloads }} bought</span>
    </div>

    <div class="book-footer">
      <div class="price">
        <strong>Rs. {{ note.price }}</strong>
        @if (note.originalPrice) {
          <del>Rs. {{ note.originalPrice }}</del>
        }
      </div>
      <button type="button" class="buy-btn" (click)="preview.emit(note)">
        Get book
      </button>
    </div>
  </div>
</article>
