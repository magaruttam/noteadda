<article class="flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700">
  <button
    type="button"
    class="group relative flex w-full cursor-pointer items-center justify-center border-0 bg-slate-50 px-4 py-6 dark:bg-slate-800/60"
    (click)="preview.emit(note)"
    [attr.aria-label]="'Preview ' + note.title"
  >
    @if (note.badge) {
      <span class="absolute left-3 top-3 rounded-full bg-white/95 px-2.5 py-0.5 text-[11px] font-semibold text-slate-700 shadow-xs dark:bg-slate-900/90 dark:text-slate-200">
        {{ note.badge }}
      </span>
    }
    @if (note.originalPrice && note.originalPrice > note.price) {
      <span class="absolute right-3 top-3 rounded-full bg-emerald-50 px-2.5 py-0.5 text-[11px] font-bold text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300">
        Save {{ Math.round(((note.originalPrice - note.price) / note.originalPrice) * 100) }}%
      </span>
    }

    <div class="relative flex h-44 w-32 overflow-hidden rounded-l-md rounded-r-xl py-3.5 pl-4 pr-3 text-left text-white shadow-lg transition group-hover:scale-[1.03]" [class]="'cover-' + note.color">
      <div class="absolute inset-y-0 left-0 w-2 bg-slate-900/25" aria-hidden="true"></div>
      <div class="flex w-full flex-col justify-between">
        <span class="text-[9px] font-medium uppercase tracking-wider opacity-85">{{ note.course }}</span>
        <strong class="line-clamp-3 text-xs font-semibold leading-snug">{{ note.title }}</strong>
        <span class="text-[10px] opacity-85">{{ note.semester }} · {{ note.pages }}p</span>
      </div>
    </div>

    <span class="pointer-events-none absolute bottom-2.5 rounded-full bg-slate-900/80 px-3 py-1 text-[11px] font-medium text-white opacity-0 transition group-hover:opacity-100">
      View details
    </span>
  </button>

  <div class="flex flex-1 flex-col p-4">
    <div class="mb-1 text-xs font-medium text-slate-400">{{ note.university }}</div>
    <button
      type="button"
      class="mb-1.5 cursor-pointer border-0 bg-transparent p-0 text-left text-sm font-bold leading-snug text-slate-900 transition hover:text-indigo-600 dark:text-white dark:hover:text-indigo-400"
      (click)="preview.emit(note)"
    >
      {{ note.title }}
    </button>

    <div class="mb-3 text-xs text-slate-500 dark:text-slate-400">By {{ note.seller }}</div>

    <div class="mb-3.5 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
      <span class="inline-flex items-center gap-1">
        <span class="text-amber-500" aria-hidden="true">★</span>
        <strong class="text-slate-800 dark:text-slate-200">{{ note.rating }}</strong>
        <span>({{ note.reviews }})</span>
      </span>
      <span>{{ note.downloads }} bought</span>
    </div>

    <div class="mt-auto flex items-center justify-between gap-2 border-t border-slate-100 pt-3 dark:border-slate-800">
      <div class="flex items-baseline gap-1.5">
        <strong class="text-base font-bold text-slate-900 dark:text-white">Rs. {{ note.price }}</strong>
        @if (note.originalPrice) {
          <del class="text-xs text-slate-400">Rs. {{ note.originalPrice }}</del>
        }
      </div>
      <button
        type="button"
        class="cursor-pointer rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-indigo-700"
        (click)="preview.emit(note)"
      >
        Get book
      </button>
    </div>
  </div>
</article>
