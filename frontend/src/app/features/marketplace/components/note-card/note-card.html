<article class="flex h-full flex-col rounded-2xl border border-slate-200/90 bg-white p-3 transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700">
  <button
    type="button"
    class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl border-0 bg-slate-100/90 px-4 py-7 dark:bg-slate-800/70"
    (click)="preview.emit(note)"
    [attr.aria-label]="'Preview ' + note.title"
  >
    @if (note.badge) {
      <span class="absolute left-3 top-3 z-10 rounded-full bg-white px-2.5 py-1 text-[10px] font-bold uppercase tracking-wide text-slate-800 shadow-xs dark:bg-slate-900 dark:text-slate-100">
        {{ note.badge }}
      </span>
    }
    @if (note.originalPrice && note.originalPrice > note.price) {
      <span class="absolute right-3 top-3 z-10 rounded-full bg-emerald-600 px-2.5 py-1 text-[10px] font-bold text-white shadow-xs">
        Save {{ Math.round(((note.originalPrice - note.price) / note.originalPrice) * 100) }}%
      </span>
    }

    <div
      class="relative flex h-44 w-32 overflow-hidden rounded-l-sm rounded-r-xl py-3.5 pl-4 pr-3 text-left text-white shadow-[10px_16px_24px_-8px_rgba(15,23,42,0.45)] transition duration-200 [transform:perspective(700px)_rotateY(-8deg)] group-hover:[transform:perspective(700px)_rotateY(-2deg)_scale(1.03)]"
      [class]="'cover-' + note.color"
    >
      <div class="absolute inset-y-0 left-0 w-2.5 bg-slate-950/25" aria-hidden="true"></div>
      <div class="flex w-full flex-col justify-between">
        <span class="text-[9px] font-semibold uppercase tracking-wider opacity-85">{{ note.course }}</span>
        <strong class="line-clamp-3 text-sm font-bold leading-snug">{{ note.title }}</strong>
        <span class="text-[10px] opacity-85">{{ note.semester }} · {{ note.pages }} pp</span>
      </div>
    </div>
  </button>

  <div class="flex flex-1 flex-col px-1.5 pb-1 pt-3.5">
    <div class="mb-1 text-[11px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
      {{ note.university }}
    </div>

    <button
      type="button"
      class="mb-1 cursor-pointer border-0 bg-transparent p-0 text-left text-[15px] font-bold leading-snug text-slate-900 transition hover:text-indigo-600 dark:text-white dark:hover:text-indigo-400"
      (click)="preview.emit(note)"
    >
      {{ note.title }}
    </button>

    <div class="mb-2.5 text-xs text-slate-500 dark:text-slate-400">By {{ note.seller }}</div>

    <div class="mb-3.5 flex items-center gap-3.5 text-xs text-slate-500 dark:text-slate-400">
      <span class="inline-flex items-center gap-1">
        <span class="text-amber-400" aria-hidden="true">★</span>
        <strong class="font-semibold text-slate-900 dark:text-slate-200">{{ note.rating }}</strong>
        <span>({{ note.reviews }})</span>
      </span>
      <span class="inline-flex items-center gap-1">
        <svg class="h-3.5 w-3.5 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
        </svg>
        <span>{{ formatDownloads(note.downloads) }}</span>
      </span>
    </div>

    <div class="mt-auto flex items-center justify-between gap-2 border-t border-slate-100 pt-3 dark:border-slate-800">
      <div class="flex items-baseline gap-2">
        <strong class="text-lg font-bold text-slate-900 dark:text-white">Rs. {{ note.price }}</strong>
        @if (note.originalPrice) {
          <del class="text-xs text-slate-400">Rs. {{ note.originalPrice }}</del>
        }
      </div>
      <button
        type="button"
        class="cursor-pointer rounded-full bg-indigo-600 px-4 py-2 text-xs font-semibold text-white transition hover:bg-indigo-700"
        (click)="preview.emit(note)"
      >
        Get book
      </button>
    </div>
  </div>
</article>
